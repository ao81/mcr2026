# basic/ や release/ を変えて main に push すると、模擬の中の走行プログラムを自動で最新にする
#   ・public ブランチの simulator/index.html（GitHub Pages のシミュレータ）を作り直す（basic/ を WebAssembly にして埋め込む）
#   ・public ブランチの release-sim/index.html（release.ino の模擬）を作り直す（release/release.ino を WebAssembly にして埋め込む）
#   ・main の debug/ を basic/ に合わせる（debug/sync.sh と同じ）
#   変わったファイルがあれば、このワークフローがコミットする。手元の main は git pull するだけでよい。
#   GitHub の Actions のページの「Run workflow」から手で動かすこともできる。
name: 模擬を最新の basic/・release/ に更新

on:
  push:
    branches: [main]
    paths:
      - "basic/**"
      - "release/**"
      - "tools/course_sim/**"
      - "tools/host_test/mock/**"
      - "tools/config_editor.py"
      - "debug/dbg_config.h"
      - "debug/dbglog.ino"
      - ".github/workflows/update-sim.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sim
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # 画面に出す「basic/ を最後に変えたコミット」を調べるため

      - name: コミットする人の名前
        run: |
          git config --global user.name "ao81"
          git config --global user.email "mc4@outlook.jp"

      - name: WebAssembly 用のコンパイラを入れる
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang lld wasi-libc libc++-18-dev-wasm32 libclang-rt-18-dev-wasm32

      - name: debug/ を basic/ に合わせて main にコミット
        run: |
          python3 tools/config_editor.py --sync
          if git diff --quiet -- debug; then echo "debug/ は変更なし"; exit 0; fi
          git add debug
          git commit -m "debug/ を basic/ のコミット $(git log -1 --format=%h -- basic) に合わせて自動更新"
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            sleep $((i * 5))
            git pull --rebase origin main
          done
          exit 1

      - name: simulator と release-sim を作り直して public ブランチにコミット
        run: |
          git fetch origin public
          git worktree add ../public origin/public
          SIM_OUT=../public/simulator/index.html python3 tools/course_sim/web/build.py
          SIM_OUT=../public/release-sim/index.html python3 tools/course_sim/web/build_release.py
          rev=$(git log -1 --format=%h -- basic)
          rrev=$(git log -1 --format=%h -- release/release.ino)
          cd ../public
          msg=()
          for f in simulator/index.html release-sim/index.html; do
            # 作った日だけが変わったときは元に戻す
            if git cat-file -e HEAD:$f 2>/dev/null && cmp -s <(git show HEAD:$f | sed 's/"built": "[^"]*"//') <(sed 's/"built": "[^"]*"//' $f); then
              git checkout -- $f
            fi
            if [ -n "$(git status --porcelain -- $f)" ]; then
              git add $f
              case $f in
                simulator/*) msg+=("シミュレータを main の basic/ のコミット $rev に合わせて自動更新") ;;
                *) msg+=("release.ino の模擬を main の release/release.ino のコミット $rrev に合わせて自動更新") ;;
              esac
            fi
          done
          if [ ${#msg[@]} -eq 0 ]; then echo "simulator・release-sim は変更なし"; exit 0; fi
          git commit -m "${msg[0]}" ${msg[1]:+-m "${msg[1]}"}
          for i in 1 2 3 4; do
            git push origin HEAD:public && exit 0
            sleep $((i * 5))
            git pull --rebase origin public
          done
          exit 1
